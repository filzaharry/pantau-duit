<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#007AFF" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
		<title>Pantau-Duit | Telegram-First SaaS Financial Command Center</title>
		<script>
			// Immediate theme execution to prevent Flash of Unstyled Content (FOUC)
			try {
				const theme = localStorage.getItem('pantau_theme') || 'system';
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (theme === 'dark' || (theme === 'system' && prefersDark)) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body class="bg-[#F8FAFC] text-[#0F172A] dark:bg-[#0B0F17] dark:text-[#F8FAFC] antialiased selection:bg-[#007AFF]/20 selection:text-[#007AFF] min-h-screen">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-wallet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg-wallet)"/>
  <rect x="16" y="16" width="88" height="88" rx="20" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Classic Leather Wallet -->
  <g transform="translate(60, 52)">
    <rect x="-32" y="-20" width="64" height="40" rx="9" fill="white" fill-opacity="0.95"/>
    <path d="M-32 -6 L32 -6" stroke="#D97706" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Wallet Flap & Clasp -->
    <path d="M12 -8 H32 V8 H12 Q6 0 12 -8 Z" fill="url(#leather)"/>
    <circle cx="22" cy="0" r="3.5" fill="white"/>
  </g>
  <text x="60" y="98" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">DOMPET KULIT</text>
</svg>
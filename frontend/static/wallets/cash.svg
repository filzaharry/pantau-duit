<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-cash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg-cash)"/>
  <rect x="16" y="16" width="88" height="88" rx="20" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Stack of Cash Banknotes -->
  <g transform="translate(60, 52)">
    <rect x="-30" y="-4" width="60" height="32" rx="5" fill="#065F46" fill-opacity="0.6" transform="rotate(-5)"/>
    <rect x="-30" y="-12" width="60" height="32" rx="5" fill="#059669" transform="rotate(3)"/>
    <rect x="-30" y="-18" width="60" height="32" rx="5" fill="white" fill-opacity="0.95"/>
    <!-- Bill Details -->
    <rect x="-26" y="-14" width="52" height="24" rx="3" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="0" cy="-2" r="7" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
    <text x="0" y="1" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-size="8" font-weight="900">Rp</text>
  </g>
  <text x="60" y="98" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">UANG TUNAI</text>
</svg>
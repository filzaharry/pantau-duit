    <circle cx="0" cy="0" r="20" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="0" y="8" text-anchor="middle" fill="#78350F" font-family="system-ui, sans-serif" font-size="24" font-weight="900">₿</text>
  </g>
  <text x="60" y="98" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">KRIPTO / RDN</text>
</svg>